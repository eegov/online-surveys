spring:
  application:
    name: survey-server
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/surveys}
    username: ${DB_USER:surveys}
    password: ${DB_PASSWORD:surveys}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
