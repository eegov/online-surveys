name: CI

# Проверки при каждом push в любую ветку и при каждом pull request.
# Имена jobs (lint, test, build) указаны в защите ветки master как обязательные: не переименовывать.
# Шаги сервера выполняются, если в ветке есть server/pom.xml, шаги клиента, если есть client/package.json.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        if: hashFiles('server/pom.xml') != ''
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-node@v7
        if: hashFiles('client/package.json') != ''
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Server / Checkstyle
        if: hashFiles('server/pom.xml') != ''
        working-directory: server
        run: ./mvnw -B -ntp checkstyle:check

      - name: Client / install dependencies
        if: hashFiles('client/package.json') != ''
        working-directory: client
        run: npm ci

      - name: Client / ESLint
        if: hashFiles('client/package.json') != ''
        working-directory: client
        # JSON-отчёт для метрик; при ошибках выводим их в читаемом виде и падаем.
        run: npm run lint:report || { npm run lint; exit 1; }

      - name: Client / Prettier
        if: hashFiles('client/package.json') != ''
        working-directory: client
        run: npm run format:check

      - name: Lint metrics to job summary
        if: always()
        run: python3 scripts/collect_metrics.py --summary

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lint-reports
          path: |
            server/target/checkstyle-result.xml
            client/reports/eslint.json
          if-no-files-found: ignore

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        if: hashFiles('server/pom.xml') != ''
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-node@v7
        if: hashFiles('client/package.json') != ''
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json

      # Модульные (surefire) и интеграционные (failsafe + Testcontainers) тесты, покрытие JaCoCo.
      - name: Server / unit and integration tests
        if: hashFiles('server/pom.xml') != ''
        working-directory: server
        run: ./mvnw -B -ntp verify

      - name: Client / install dependencies
        if: hashFiles('client/package.json') != ''
        working-directory: client
        run: npm ci

      - name: Client / tests with coverage (Vitest)
        if: hashFiles('client/package.json') != ''
        working-directory: client
        run: npm test

      - name: Test and coverage metrics to job summary
        if: always()
        run: python3 scripts/collect_metrics.py --summary

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports
          path: |
            server/target/site/jacoco/
            server/target/surefire-reports/
            server/target/failsafe-reports/
            client/coverage/
            client/reports/
          if-no-files-found: ignore

  build:
    name: build
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        if: hashFiles('server/pom.xml') != ''
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-node@v7
        if: hashFiles('client/package.json') != ''
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json

      # Тесты уже прошли в job test, здесь только сборка артефактов.
      - name: Server / package jar
        if: hashFiles('server/pom.xml') != ''
        working-directory: server
        run: ./mvnw -B -ntp -DskipTests package

      - name: Client / production build
        if: hashFiles('client/package.json') != ''
        working-directory: client
        run: |
          npm ci
          npm run build

      - uses: actions/upload-artifact@v7
        if: hashFiles('server/pom.xml') != ''
        with:
          name: survey-server-jar
          path: server/target/survey-server.jar
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: hashFiles('client/package.json') != ''
        with:
          name: survey-client-dist
          path: client/dist/
          if-no-files-found: error
