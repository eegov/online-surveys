name: Release

# Релиз создаётся тегом vX.Y.Z на завершение этапа разработки (см. CONTRIBUTING.md).
# Workflow заново проверяет и собирает проект, снимает метрики качества на момент этапа
# и публикует GitHub Release с артефактами и таблицей метрик.
# Запуск вручную (workflow_dispatch) только снимает метрики, без релиза.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pull-requests: read

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Server / lint, tests, coverage, jar
        working-directory: server
        run: ./mvnw -B -ntp checkstyle:check verify

      - name: Client / lint, tests, coverage, build
        working-directory: client
        run: |
          npm ci
          npm run lint:report
          npm run format:check
          npm test
          npm run build

      - name: Collect quality metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          python3 scripts/collect_metrics.py --git --github ${TAG:+--tag "$TAG"} \
            --json metrics.json --md metrics.md --summary

      - name: Package artifacts
        run: |
          mkdir -p release
          cp server/target/survey-server.jar release/
          (cd client/dist && zip -qr ../../release/survey-client-dist.zip .)
          cp metrics.json metrics.md release/

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ github.ref_name }}
          path: release/

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        # Текст релиза: таблица метрик, под ней список PR, который GitHub генерирует сам.
        # Тег с суффиксом (v0.1.0-alpha.1) публикуется как pre-release.
        run: |
          prerelease=()
          if [[ "$TAG" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$TAG" release/* \
            --title "$TAG" \
            --notes-file metrics.md \
            --generate-notes \
            --verify-tag \
            "${prerelease[@]}"
