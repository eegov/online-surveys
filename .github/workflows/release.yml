name: Release

# Релиз создаётся тегом vX.Y.Z на master по завершении этапа разработки (см. CONTRIBUTING.md).
# Job measure заново проверяет и собирает проект и снимает метрики качества на момент этапа,
# job publish публикует GitHub Release с артефактами и таблицей метрик.
# Запуск вручную (workflow_dispatch) только снимает метрики, без релиза.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    name: measure
    runs-on: ubuntu-latest
    # Права только на чтение: здесь выполняются npm ci и плагины Maven (сторонний код).
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Tag must point to a commit on master
        if: github.ref_type == 'tag'
        run: |
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "OK: $GITHUB_REF_NAME is on master"
          else
            echo "::error::Tag $GITHUB_REF_NAME is not on master. Merge dev into master first, then tag master."
            exit 1
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Server / lint, tests, coverage, jar
        working-directory: server
        run: ./mvnw -B -ntp checkstyle:check verify

      - name: Client / lint, tests, coverage, build
        working-directory: client
        run: |
          npm ci
          npm run lint:report
          npm run format:check
          npm test
          npm run build

      - name: Collect quality metrics
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          python3 scripts/collect_metrics.py --git --github ${TAG:+--tag "$TAG"} \
            --json metrics.json --md metrics.md --summary

      - name: Package artifacts
        run: |
          mkdir -p release
          cp server/target/survey-server.jar release/
          (cd client/dist && zip -qr ../../release/survey-client-dist.zip .)
          cp metrics.json metrics.md release/

      - uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: release/
          if-no-files-found: error

  publish:
    name: publish
    needs: measure
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    # Право записи нужно только здесь, и здесь не выполняется код зависимостей.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-files
          path: release

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        # Текст релиза: таблица метрик, под ней список PR, который GitHub генерирует сам.
        # Тег с суффиксом (v0.1.0-alpha.1) публикуется как pre-release.
        run: |
          prerelease=()
          if [[ "$TAG" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes-file release/metrics.md \
            --generate-notes \
            --verify-tag \
            "${prerelease[@]}"
